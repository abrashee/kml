###############################################################################
# CORE APPLICATION SETTINGS
###############################################################################
spring.application.name=kml-inventory-service
# Service listens on SERVER_PORT when provided; defaults to 8080.
server.port=${SERVER_PORT:8080}

###############################################################################
# DATABASE CONFIGURATION (POSTGRESQL & FLYWAY)
###############################################################################
# Dynamically constructs URL or pulls directly from defined SPRING_DATASOURCE_URL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${INVENTORY_SERVICE_DB:kml_inventory}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Properties
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public

# Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

###############################################################################
# DISTRIBUTED MESSAGING & EVENT STREAMING
###############################################################################
# Apache Kafka Engine Setup
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP_ID:kml-inventory-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.kml.services.common.events

# RabbitMQ Broker Setup
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false

###############################################################################
# SEARCH INDEX CONFIGURATION
###############################################################################
kml.opensearch.url=${KML_OPENSEARCH_URL:http://opensearch:9200}
kml.opensearch.inventory-index=${KML_OPENSEARCH_INVENTORY_INDEX:inventory-items}
kml.opensearch.products-index=${KML_OPENSEARCH_PRODUCTS_INDEX:products}

###############################################################################
# INTER-SERVICE COMMUNICATION ARCHITECTURE (HTTP CLIENT ENDPOINTS)
###############################################################################
kml.services.user-url=${KML_SERVICES_USER_URL:http://user-service:8080}
kml.services.order-url=${KML_SERVICES_ORDER_URL:http://order-service:8080}
kml.services.inventory-url=${KML_SERVICES_INVENTORY_URL:http://inventory-service:8080}
kml.services.warehouse-url=${KML_SERVICES_WAREHOUSE_URL:http://warehouse-service:8080}
kml.services.shipment-url=${KML_SERVICES_SHIPMENT_URL:http://shipment-service:8080}

###############################################################################
# OBSERVABILITY, HEALTH PROBES, AND DISTRIBUTED TRACING
###############################################################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# OpenTelemetry Distributed Tracing Integration
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}
