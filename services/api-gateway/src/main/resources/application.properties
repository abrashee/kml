###############################################################################
# CORE APPLICATION SETTINGS
###############################################################################
spring.application.name=kml-api-gateway
# Maps to the SERVER_PORT environment variable when provided; defaults to 8080.
server.port=${SERVER_PORT:8080}

###############################################################################
# DOWNSTREAM MICROSERVICES SYSTEM INTERNAL TARGET URLS
###############################################################################
kml.services.user-url=${KML_SERVICES_USER_URL:http://user-service:8080}
kml.services.order-url=${KML_SERVICES_ORDER_URL:http://order-service:8080}
kml.services.inventory-url=${KML_SERVICES_INVENTORY_URL:http://inventory-service:8080}
kml.services.warehouse-url=${KML_SERVICES_WAREHOUSE_URL:http://warehouse-service:8080}
kml.services.shipment-url=${KML_SERVICES_SHIPMENT_URL:http://shipment-service:8080}

###############################################################################
# SPRING CLOUD GATEWAY ROUTING CONFIGURATION
###############################################################################
# User & Authentication Services Route
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${kml.services.user-url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/users/**,/api/v1/auth/**,/uploads/**

# Order Management Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=order-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${kml.services.order-url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/orders/**

# Inventory Control Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=inventory-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${kml.services.inventory-url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/v1/inventories/**,/api/v1/inventory/**

# Warehouse Management Service (WMS) Route
spring.cloud.gateway.server.webmvc.routes[3].id=warehouse-service
spring.cloud.gateway.server.webmvc.routes[3].uri=${kml.services.warehouse-url}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/v1/warehouses/**,/api/v1/storage-units/**

# Dispatch & Shipment Orchestration Route
spring.cloud.gateway.server.webmvc.routes[4].id=shipment-service
spring.cloud.gateway.server.webmvc.routes[4].uri=${kml.services.shipment-url}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/v1/shipments/**,/api/wms/**

###############################################################################
# GLOBAL CROSS-ORIGIN RESOURCE SHARING (CORS) CONFIGURATION
###############################################################################
# Allows overriding target deployment frontends dynamically via environment variables
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-origin-patterns=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173,http://127.0.0.1:4200,http://127.0.0.1:5173}
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webmvc.globalcors.cors-configurations.[/**].allow-credentials=true

###############################################################################
# OBSERVABILITY, HEALTH PROBES, AND OPENTELEMETRY TRACING (ACTUATOR)
###############################################################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# Distributed Tracing via OpenTelemetry Collector
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}
