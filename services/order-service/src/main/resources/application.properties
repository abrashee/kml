spring.application.name=kml-order-service
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/kml_order}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:kml_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

kml.services.user-url=${KML_SERVICES_USER_URL:http://localhost:8081}
kml.internal-service-token=${KML_INTERNAL_SERVICE_TOKEN:local-development-only-token}
kml.services.order-url=${KML_SERVICES_ORDER_URL:http://localhost:8083}
kml.services.inventory-url=${KML_SERVICES_INVENTORY_URL:http://localhost:8082}
kml.services.warehouse-url=${KML_SERVICES_WAREHOUSE_URL:http://localhost:8085}
kml.services.shipment-url=${KML_SERVICES_SHIPMENT_URL:http://localhost:8084}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
