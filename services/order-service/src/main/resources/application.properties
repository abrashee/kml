###############################################################################
# CORE APPLICATION SETTINGS
###############################################################################
spring.application.name=kml-order-service
# Service listens on SERVER_PORT when provided; defaults to 8080.
server.port=${SERVER_PORT:8080}

###############################################################################
# DATABASE CONFIGURATION (POSTGRESQL & FLYWAY)
###############################################################################
# Dynamically resolves database route or falls back to order-specific DB schema
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${ORDER_SERVICE_DB:kml_order}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Engines Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public

# Database Schema Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

###############################################################################
# DISTRIBUTED MESSAGING & EVENT STREAMING
###############################################################################
# Apache Kafka Cluster Endpoint
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# RabbitMQ Message Broker Setup
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

###############################################################################
# SECURITY & INTER-SERVICE ARCHITECTURE (HTTP CLIENT ENDPOINTS)
###############################################################################
# Secure internal token used for authorizing cross-microservice internal requests
kml.internal-service-token=${KML_INTERNAL_SERVICE_TOKEN}

# Target HTTP service endpoints
kml.services.user-url=${KML_SERVICES_USER_URL:http://user-service:8080}
kml.services.order-url=${KML_SERVICES_ORDER_URL:http://order-service:8080}
kml.services.inventory-url=${KML_SERVICES_INVENTORY_URL:http://inventory-service:8080}
kml.services.warehouse-url=${KML_SERVICES_WAREHOUSE_URL:http://warehouse-service:8080}
kml.services.shipment-url=${KML_SERVICES_SHIPMENT_URL:http://shipment-service:8080}

###############################################################################
# OBSERVABILITY, HEALTH PROBES, AND DISTRIBUTED TRACING
###############################################################################
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true

# OpenTelemetry Distributed Tracing Integration
management.tracing.enabled=${MANAGEMENT_TRACING_ENABLED:true}
management.tracing.sampling.probability=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://otel-collector:4318/v1/traces}

# RabbitMQ tracing/observation
spring.rabbitmq.template.observation-enabled=true
spring.rabbitmq.listener.simple.observation-enabled=true

# Reduce low-value Spring Security tracing noise

# Disable low-value Spring Security observations

# Disable low-value Spring Security filter-chain observations
management.observations.enable.spring.security.filterchains=false
management.observations.enable.spring.security.http.secured.requests=false
management.observations.enable.spring.security.http.unsecured.requests=false

spring.jpa.open-in-view=false
logging.level.org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration=ERROR
