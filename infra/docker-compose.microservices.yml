x-kml-service-environment: &kml-service-environment
  SPRING_PROFILES_ACTIVE: docker,microservice
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${POSTGRES_DB:-kml_logistics}
  DB_USER: ${POSTGRES_USER:-kml_admin}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-kml_admin}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:-kml_broker}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-change-me}
  KML_OPENSEARCH_URL: http://opensearch:9200
  MANAGEMENT_TRACING_ENABLED: ${MANAGEMENT_TRACING_ENABLED:-true}
  MANAGEMENT_TRACING_SAMPLING_PROBABILITY: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
  MANAGEMENT_OTLP_TRACING_ENDPOINT: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
  KML_SERVICES_USER_URL: http://user-service:8080
  KML_SERVICES_ORDER_URL: http://order-service:8080
  KML_SERVICES_WAREHOUSE_URL: http://warehouse-service:8080
  KML_SERVICES_SHIPMENT_URL: http://shipment-service:8080
  KML_SERVICES_INVENTORY_URL: http://inventory-service:8080
  KML_SERVICES_FULFILLMENT_URL: http://inventory-service:8080
  KML_INTERNAL_SERVICE_TOKEN: ${KML_INTERNAL_SERVICE_TOKEN:-local-development-only-token}

services:
  postgres:
    image: postgres:16-alpine
    container_name: kml-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kml_logistics}
      POSTGRES_USER: ${POSTGRES_USER:-kml_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-microservice-databases.sql:/docker-entrypoint-initdb.d/01-init-microservice-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kml_admin} -d ${POSTGRES_DB:-kml_logistics}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kml-services

  redis:
    image: redis:7.2-alpine
    container_name: kml-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 3
    networks:
      - kml-services

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: kml-opensearch
    environment:
      - cluster.name=kml-search-cluster
      - node.name=kml-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 10s
      retries: 3
    networks:
      - kml-services

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: kml-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost:2181 5 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 10s
    networks:
      - kml-services

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kml-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b localhost:9092 1 10 >/dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 12
      start_period: 20s
    networks:
      - kml-services

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: kml-rabbitmq
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-kml_broker}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - kml-services

  api-gateway:
    build:
      context: ../services
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    container_name: kml-api-gateway
    depends_on:
      - user-service
      - order-service
      - inventory-service
      - warehouse-service
      - shipment-service
    environment:
      <<: *kml-service-environment
      SPRING_APPLICATION_NAME: kml-api-gateway
      KML_SERVICE_BOUNDARY: gateway
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"
    profiles:
      - microservices
    expose:
      - "8080"
    networks:
      - kml-services

  user-service:
    build:
      context: ../services
      dockerfile: Dockerfile
      args:
        MODULE: user-service
    container_name: kml-user-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *kml-service-environment
      SPRING_APPLICATION_NAME: kml-user-service
      KML_SERVICE_BOUNDARY: user
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kml_user
    ports:
      - "${USER_SERVICE_PORT:-8081}:8080"
    profiles:
      - microservices
    expose:
      - "8080"
    networks:
      - kml-services

  inventory-service:
    build:
      context: ../services
      dockerfile: Dockerfile
      args:
        MODULE: inventory-service
    container_name: kml-inventory-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kml-service-environment
      SPRING_APPLICATION_NAME: kml-inventory-service
      KML_SERVICE_BOUNDARY: inventory
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kml_inventory
    ports:
      - "${INVENTORY_SERVICE_PORT:-8082}:8080"
    profiles:
      - microservices
    expose:
      - "8080"
    networks:
      - kml-services

  order-service:
    build:
      context: ../services
      dockerfile: Dockerfile
      args:
        MODULE: order-service
    container_name: kml-order-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kml-service-environment
      SPRING_APPLICATION_NAME: kml-order-service
      KML_SERVICE_BOUNDARY: order
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kml_order
    ports:
      - "${ORDER_SERVICE_PORT:-8083}:8080"
    profiles:
      - microservices
    expose:
      - "8080"
    networks:
      - kml-services

  shipment-service:
    build:
      context: ../services
      dockerfile: Dockerfile
      args:
        MODULE: shipment-service
    container_name: kml-shipment-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kml-service-environment
      SPRING_APPLICATION_NAME: kml-shipment-service
      KML_SERVICE_BOUNDARY: shipment
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kml_shipment
    ports:
      - "${SHIPMENT_SERVICE_PORT:-8084}:8080"
    profiles:
      - microservices
    expose:
      - "8080"
    networks:
      - kml-services

  warehouse-service:
    build:
      context: ../services
      dockerfile: Dockerfile
      args:
        MODULE: warehouse-service
    container_name: kml-warehouse-service
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      <<: *kml-service-environment
      SPRING_APPLICATION_NAME: kml-warehouse-service
      KML_SERVICE_BOUNDARY: warehouse
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/kml_warehouse
    ports:
      - "${WAREHOUSE_SERVICE_PORT:-8085}:8080"
    profiles:
      - microservices
    expose:
      - "8080"
    networks:
      - kml-services

  admin-frontend:
    build:
      context: ../frontend/admin-frontend
    container_name: kml-admin-frontend
    depends_on:
      - api-gateway
    ports:
      - "${ADMIN_FRONTEND_PORT:-4200}:80"
    profiles:
      - microservices
    networks:
      - kml-services

  customer-frontend:
    build:
      context: ../frontend/customer-frontend
    container_name: kml-customer-frontend
    depends_on:
      - api-gateway
    ports:
      - "${CUSTOMER_FRONTEND_PORT:-5173}:80"
    profiles:
      - microservices
    networks:
      - kml-services

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: kml-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles:
      - microservices
    networks:
      - kml-services

  grafana:
    image: grafana/grafana:11.0.0
    container_name: kml-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - grafana_data:/var/lib/grafana
    profiles:
      - microservices
    networks:
      - kml-services

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: kml-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    profiles:
      - microservices
    networks:
      - kml-services

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.104.0
    container_name: kml-otel-collector
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      - jaeger
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"
      - "${OTEL_HTTP_PORT:-4318}:4318"
    profiles:
      - microservices
    networks:
      - kml-services

networks:
  kml-services:
    name: kml-services

volumes:
  postgres_data:
  redis_data:
  opensearch_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
