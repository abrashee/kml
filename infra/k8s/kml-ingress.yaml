apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kml-ingress
  namespace: kml
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - customer.kml.example.com
        - admin.kml.example.com
      secretName: kml-ingress-tls
  rules:
    - host: customer.kml.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: customer-frontend
                port:
                  name: http
    - host: admin.kml.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  name: http
