apiVersion: v1
kind: Secret
metadata:
  name: kml-secrets
  namespace: kml
type: Opaque
stringData:
  # Mock local secret values. Replace these with one Secret per service in production,
  # or use the ExternalSecret template below to sync from your cloud secret manager.
  SPRING_DATASOURCE_USERNAME: kml
  SPRING_DATASOURCE_PASSWORD: change-me
  RABBITMQ_USER: kml_broker
  RABBITMQ_PASSWORD: change-me
  JWT_SECRET: replace-with-at-least-32-random-bytes
  KML_INTERNAL_SERVICE_TOKEN: replace-with-a-long-random-service-token
