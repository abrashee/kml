apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kml
  labels:
    app: api-gateway
  annotations:
    kml.io/release-tag-required: "true"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: api-gateway
          image: ghcr.io/abrashee/kml/api-gateway:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: kml-config
            - secretRef:
                name: kml-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_APPLICATION_NAME
              value: "kml-api-gateway"
            - name: KML_SERVICE_BOUNDARY
              value: "gateway"
            - name: KML_SERVICES_USER_URL
              value: "http://user-service:8080"
            - name: KML_SERVICES_ORDER_URL
              value: "http://order-service:8080"
            - name: KML_SERVICES_INVENTORY_URL
              value: "http://inventory-service:8080"
            - name: KML_SERVICES_WAREHOUSE_URL
              value: "http://warehouse-service:8080"
            - name: KML_SERVICES_SHIPMENT_URL
              value: "http://shipment-service:8080"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
---
