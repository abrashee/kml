apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: kml
  labels:
    app: admin-frontend
  annotations:
    kml.io/release-tag-required: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: admin-frontend
          image: ghcr.io/abrashee/kml/admin-frontend:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: kml
  labels:
    app: admin-frontend
spec:
  type: ClusterIP
  selector:
    app: admin-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
