apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: kml-secret-store
  namespace: kml
spec:
  provider:
    # Mock provider config for this public repository.
    # Production target is OCI Vault on Oracle Cloud Free Tier.
    # Keep External Secrets as the abstraction so the provider can later be
    # replaced with AWS Secrets Manager, GCP Secret Manager, Azure Key Vault,
    # HashiCorp Vault, or another supported backend without changing app code.
    fake:
      data:
        - key: kml/postgres/user
          value: kml
        - key: kml/postgres/password
          value: replace-me
        - key: kml/rabbitmq/user
          value: kml_broker
        - key: kml/rabbitmq/password
          value: replace-me
        - key: kml/jwt/secret
          value: replace-with-at-least-32-random-bytes
        - key: kml/internal-service/token
          value: replace-with-a-long-random-service-token
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kml-runtime-secrets
  namespace: kml
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kml-secret-store
    kind: SecretStore
  target:
    name: kml-secrets
    creationPolicy: Owner
  data:
    - secretKey: SPRING_DATASOURCE_USERNAME
      remoteRef:
        key: kml/postgres/user
    - secretKey: SPRING_DATASOURCE_PASSWORD
      remoteRef:
        key: kml/postgres/password
    - secretKey: RABBITMQ_USER
      remoteRef:
        key: kml/rabbitmq/user
    - secretKey: RABBITMQ_PASSWORD
      remoteRef:
        key: kml/rabbitmq/password
    - secretKey: JWT_SECRET
      remoteRef:
        key: kml/jwt/secret
    - secretKey: KML_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: kml/internal-service/token
