global:
  scrape_interval: 30m
  evaluation_interval: 30m

scrape_configs:
  - job_name: 'kml-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - 'api-gateway:8080'
          - 'user-service:8080'
          - 'order-service:8080'
          - 'inventory-service:8080'
          - 'warehouse-service:8080'
          - 'shipment-service:8080'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
          - 'postgres-exporter:9187'

  - job_name: 'rabbitmq'
    static_configs:
      - targets:
          - 'rabbitmq:15692'

  - job_name: 'kafka-exporter'
    static_configs:
      - targets:
          - 'kafka-exporter:9308'

  - job_name: 'opensearch-exporter'
    static_configs:
      - targets:
          - 'opensearch-exporter:9114'
