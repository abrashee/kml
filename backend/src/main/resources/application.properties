# =========================
# Database
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:kml_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=public

# =========================
# Flyway
# =========================
spring.flyway.enabled=true
spring.flyway.schemas=public
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =========================
# External Services
# =========================
gemini.api.url=${GEMINI_API_URL}
gemini.api.key=${GEMINI_API_KEY}
routing.fallback.enabled=${ROUTING_FALLBACK_ENABLED:true}

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:86400000}

# =========================
# OpenAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/api-docs

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# =========================
# Pagination defaults
# =========================
spring.data.web.pageable.default-page-size=20