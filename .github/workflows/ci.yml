name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

jobs:
  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - user-service
          - order-service
          - inventory-service
          - warehouse-service
          - shipment-service
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw -q -pl ${{ matrix.service }} -am test

  microservice-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: docker/setup-buildx-action@v3
      - run: bash scripts/microservice-integration-smoke.sh

  customer-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/customer-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/customer-frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx vite preview --host 127.0.0.1 --port 4173 > /tmp/customer-vite-preview.log 2>&1 &
      - run: npx wait-on@latest http://127.0.0.1:4173
      - run: |
          npx lighthouse http://127.0.0.1:4173 \
            --preset=desktop \
            --only-categories=performance,accessibility,best-practices,seo \
            --no-enable-error-reporting \
            --chrome-flags="--headless --no-sandbox" \
            --output=json \
            --output-path=./lighthouse-ci.json
      - run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('./lighthouse-ci.json', 'utf8'));
          const thresholds = {
            performance: 0.90,
            accessibility: 0.90,
            'best-practices': 0.95,
            seo: 0.80,
          };

          let failed = false;
          for (const [category, min] of Object.entries(thresholds)) {
            const score = report.categories[category].score;
            console.log(`${category}: ${Math.round(score * 100)} / required ${Math.round(min * 100)}`);
            if (score < min) failed = true;
          }

          if (failed) process.exit(1);
          NODE

  admin-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/admin-frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx ng test --watch=false --browsers=ChromeHeadless
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
